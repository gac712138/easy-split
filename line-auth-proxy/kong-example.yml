# Kong Gateway 配置範例
# 請將以下區塊添加到您現有的 kong.yml 文件中

_format_version: "3.0"

# 在 services 陣列中新增以下服務
services:
  # ... 您現有的服務 (database, auth, rest, storage, etc.)
  
  - name: auth-proxy
    url: http://auth-proxy:3001
    protocol: http
    host: auth-proxy
    port: 3001
    path: /
    
# 在 routes 陣列中新增以下路由
routes:
  # ... 您現有的路由
  
  - name: auth-proxy-route
    service: auth-proxy
    hosts:
      - api-easysplit.island-dev.com
    paths:
      - /auth/line
    strip_path: false
    preserve_host: false
    protocols:
      - http
      - https

# 可選：如果需要 CORS 支援，可添加以下插件
plugins:
  - name: cors
    service: auth-proxy
    config:
      origins:
        - "https://easysplit.island-dev.com"
        - "http://localhost:3000"
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
      preflight_continue: false